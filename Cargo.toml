[package]
name = "browsegoo"
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
description = "A barebones Web browser built around the WebKit engine, using GTK4."
homepage = "https://www.aisloperator.com/"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
# 2.42 for listing all cookies.
webkit = { package = "webkit6", version = "0.6", features = ["v2_42"] }
# For downloading filter lists. WebKit does its own TLS for pages.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
rustls-platform-verifier = "0.7"
url = "2"

[profile.release]
debug = false
